[project]
name = "dataset-investigator"
version = "0.1.0"
description = "Local dataset profiling and evidence-backed investigation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=19", "scipy>=1.15,<2", "httpx>=0.28,<1", "psutil>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
