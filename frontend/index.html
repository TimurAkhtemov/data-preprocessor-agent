<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Profile and investigate your datasets entirely on your machine."
    />
    <title>Dataset Investigator</title>
    <script>
      try {
        const t = localStorage.getItem('di-theme')
        document.documentElement.classList.toggle(
          'dark',
          t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
